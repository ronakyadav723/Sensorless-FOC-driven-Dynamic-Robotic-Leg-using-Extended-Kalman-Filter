controller_manager:
  ros__parameters:
    update_rate: 1000
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    torque_controller:
      type: effort_controllers/JointGroupEffortController
joint_trajectory_controller:
  ros__parameters:
    joints:
      - hip_joint
      - knee_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    goal_time: 0.0
    stopped_velocity_tolerance: 0.01
    gains:
      hip_joint:
        p: 115.0
        d: 11.0
        i: 0.0
        i_clamp: 0.0
      knee_joint:
        p: 47.0
        d: 12.75
        i: 0.0
        i_clamp: 0.0
torque_controller:
  ros__parameters:
    joints:
      - hip_joint
      - knee_joint
